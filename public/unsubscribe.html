<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email preferences · CLASS SPHERE</title><link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/styles.css"></head><body><main class="container py-5" style="max-width:640px"><a class="brand" href="/">CLASS <span>SPHERE</span></a><section class="unit-card mt-4"><p class="eyebrow text-green">EMAIL PREFERENCES</p><h1>Unsubscribe from optional emails</h1><p>This only applies to non-essential class emails. Essential class information may still be sent.</p><button class="btn btn-success rounded-pill" id="unsubscribe">Confirm unsubscribe</button><p id="result" class="mt-3" role="status"></p></section></main><script>document.getElementById('unsubscribe').addEventListener('click',async()=>{const token=new URLSearchParams(location.search).get('token')||'';const result=document.getElementById('result');const button=document.getElementById('unsubscribe');button.disabled=true;try{const c=await fetch('/api/auth/csrf');const csrf=await c.json();if(!c.ok)throw new Error('Secure form setup is unavailable.');const r=await fetch('/api/public/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf.csrfToken},body:JSON.stringify({token})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed.');result.textContent=d.message;}catch(e){result.textContent=e.message;button.disabled=false;}});</script></body></html>
